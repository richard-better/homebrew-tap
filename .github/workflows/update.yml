name: Update Switcheroo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switcheroo-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Import the latest published release
        run: scripts/update.sh
      - name: Commit the cask
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/switcheroo.rb
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached
          version="$(sed -n 's/^  version "\([0-9.]*\)"$/\1/p' Casks/switcheroo.rb)"
          git commit -m "chore: update Switcheroo to $version"
          git -c credential.helper='!gh auth git-credential' push
