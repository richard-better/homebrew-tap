name: Update cask

on:
  workflow_dispatch:
    inputs:
      cask:
        description: The cask or formula to update from its newest release.
        type: choice
        default: switcheroo
        options:
          - switcheroo
          - trainstack-ride
          - trainstack-ride@alpha
          - herdr
          - herdr-core
  # Herdr publishes no event to start an update from, so its cask and formula check every day.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

# Every update writes to main, so they take turns, and every waiting update keeps its place.
concurrency:
  group: tap-write
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        cask: ${{ fromJSON(inputs.cask && format('["{0}"]', inputs.cask) || '["herdr","herdr-core"]') }}
    env:
      GH_TOKEN: ${{ github.token }}
      CASK: ${{ matrix.cask }}
      FILE: ${{ matrix.cask == 'herdr-core' && 'Formula' || 'Casks' }}/${{ matrix.cask }}.rb
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Import the latest published release
        run: |
          case "$CASK" in
            switcheroo) scripts/update.sh ;;
            trainstack-ride) scripts/update-trainstack-ride.sh stable ;;
            trainstack-ride@alpha) scripts/update-trainstack-ride.sh alpha ;;
            herdr) scripts/update-herdr.sh ;;
            herdr-core) scripts/update-herdr-core.sh ;;
          esac
      - name: Check the style
        if: env.CASK != 'switcheroo'
        run: |
          if [ -f "$FILE" ]; then /home/linuxbrew/.linuxbrew/bin/brew style "$FILE"; fi
      - name: Commit the change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$FILE")"
          case "$CASK" in
            switcheroo) app="Switcheroo" ;;
            trainstack-ride) app="TrainStack Ride" ;;
            trainstack-ride@alpha) app="TrainStack Ride Alpha" ;;
            herdr) app="Herdr" ;;
            herdr-core) app="herdr-core" ;;
          esac
          git commit -m "chore: update $app to $version"
          git -c credential.helper='!gh auth git-credential' pull --rebase origin main
          git -c credential.helper='!gh auth git-credential' push origin HEAD:main
